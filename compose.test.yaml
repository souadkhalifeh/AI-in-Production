services:
  test-db:
    image: postgres:17

    environment:
      POSTGRES_DB: iris_test
      POSTGRES_USER: iris_app
      POSTGRES_PASSWORD: iris_test_password

    ports:
      - "5433:5432"

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U iris_app -d iris_test"]
      interval: 5s
      timeout: 5s
      retries: 10