name: IRIS AI CI CD

on:
  push:
    branches: [master]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-24.04

    services:
      test-db:
        image: postgres:17
        env:
          POSTGRES_DB: iris_test
          POSTGRES_USER: iris_app
          POSTGRES_PASSWORD: iris_test_password
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U iris_app -d iris_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      TEST_DATABASE_URL: postgresql+psycopg://iris_app:iris_test_password@127.0.0.1:5433/iris_test

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements-dex.txt

      - name: Run tests
        run: pytest -v
  docker-build:
      runs-on: ubuntu-24.04
      needs: test

      steps:
        - name: Checkout repository
          uses: actions/checkout@v4

        - name: Build Docker image
          run: docker build -t iris-api:ci .